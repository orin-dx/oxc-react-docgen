name: Release & Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_source_sha:
        description: 'Merged Callisto release-PR commit to recover; leave empty for the triggering commit.'
        required: false
        type: string

# Least privilege at workflow scope. Every job opts into exactly what it needs,
# and registry credentials exist only inside the `execute` job.
permissions: {}

# One group per commit: GitHub replaces a pending run in a shared group, which
# could silently drop a release merge queued behind an unrelated push.
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Callisto 0.8 split releasing into two authority boundaries: the action only
  # creates or updates the release PR, and publication happens from the merged
  # release commit under the repository's own durable workflow (this file).
  # `publish: true` no longer exists as an action input -- see
  # https://github.com/orin-dx/callisto/blob/main/docs/06-publishing.md.
  release-candidate:
    name: Identify a merged Callisto release PR
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      is_release_pr: ${{ steps.candidate.outputs.is_release_pr }}
      release_source_sha: ${{ steps.candidate.outputs.release_source_sha }}
    steps:
      - id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE_SHA_INPUT: ${{ inputs.release_source_sha }}
          TRIGGERING_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          release_source_sha="${RELEASE_SOURCE_SHA_INPUT:-$TRIGGERING_SHA}"
          if [[ ! "$release_source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release_source_sha must be exactly 40 lowercase hex characters"
            exit 1
          fi
          resolved_sha=$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${release_source_sha}" --jq '.sha')
          if [[ "$resolved_sha" != "$release_source_sha" ]]; then
            echo "::error::release_source_sha does not resolve to that exact commit"
            exit 1
          fi
          # Scheduling evidence only. `callisto release plan` verifies the real
          # parent-to-merge delta against the committed decision file; PR
          # metadata is never authority for what gets published.
          prs=$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/commits/${release_source_sha}/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main" and .head.repo.full_name == "'"${GITHUB_REPOSITORY}"'" and (.head.ref == "callisto/version-packages" or (.head.ref | test("^callisto/version-packages--[0-9a-f]{40}$"))))] | length')
          verified=$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${release_source_sha}" --jq '.commit.verification.verified')
          if [[ "$prs" == 1 && "$verified" == true ]]; then
            {
              echo 'is_release_pr=true'
              echo "release_source_sha=$release_source_sha"
            } >> "$GITHUB_OUTPUT"
          else
            echo 'is_release_pr=false' >> "$GITHUB_OUTPUT"
          fi

  version-pr:
    name: Create or update the Callisto release PR
    needs: release-candidate
    if: >-
      needs.release-candidate.outputs.is_release_pr != 'true' &&
      inputs.release_source_sha == ''
    timeout-minutes: 15
    concurrency:
      group: version-pr
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Installed explicitly rather than through the action's own
      # `setup_callisto` step, so the CLI version this repo releases with is
      # pinned here and not inherited from the action's default.
      - uses: orin-dx/callisto/.github/actions/setup-callisto@c5578e6a63754b54575b3ac7518cc1753e443393 # callisto@0.8.0
        with:
          version: callisto@0.8.0
          verification: require
      - name: Compose, version, and open the release PR
        uses: orin-dx/callisto/.github/actions/callisto-action@c5578e6a63754b54575b3ac7518cc1753e443393 # callisto@0.8.0
        with:
          setup_callisto: 'false'
          branch: main
          release_branch: callisto/version-packages
          # crates/cli and crates/binding both path-depend on
          # oxc-react-docgen-core, so a core bump leaves their Cargo.lock
          # entries stale without this.
          version_command: 'callisto version --refresh-lockfiles'
        env:
          GH_TOKEN: ${{ github.token }}

  plan:
    name: Derive release intent from the merged release commit
    needs: release-candidate
    if: needs.release-candidate.outputs.is_release_pr == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: orin-dx/callisto/.github/actions/setup-callisto@c5578e6a63754b54575b3ac7518cc1753e443393 # callisto@0.8.0
        with:
          version: callisto@0.8.0
          verification: require
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-candidate.outputs.release_source_sha }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false
      - name: Derive and hash intent
        env:
          RELEASE_SOURCE_SHA: ${{ needs.release-candidate.outputs.release_source_sha }}
        run: |
          set -euo pipefail
          handoff_dir="${RUNNER_TEMP}/release-intent"
          mkdir -p "$handoff_dir"
          callisto release plan --profile production \
            --source-root "$GITHUB_WORKSPACE/release-source" \
            --orchestration-revision "$GITHUB_SHA" \
            --from-release-commit "$RELEASE_SOURCE_SHA" \
            --decision "$GITHUB_WORKSPACE/release-source/.callisto/release-decision.json" \
            --out "$handoff_dir/release-intent.json"
          shasum -a 256 "$handoff_dir/release-intent.json" > "$handoff_dir/release-intent.json.sha256"
      # This workspace declares no `[release]` product-binary section, so the
      # intent must not contain artifact slots. If one ever appears, publishing
      # without a build job would cut a forge release with missing assets.
      - name: Reject unexpected artifact slots
        run: |
          set -euo pipefail
          if [[ "$(jq '.artifactSlots | length' "${RUNNER_TEMP}/release-intent/release-intent.json")" != "0" ]]; then
            echo "::error::intent declares artifact slots but this workflow has no build job"
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-intent
          path: ${{ runner.temp }}/release-intent
          if-no-files-found: error
          # A stuck run may need `execute` re-run days later while a workflow
          # bug is diagnosed; one day loses the intent before the fix lands.
          retention-days: 7

  execute:
    name: Execute approved release
    needs: [release-candidate, plan]
    timeout-minutes: 60
    concurrency:
      group: release-execute
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Registry credentials are reachable only here. Configure the `release`
    # environment with at least one required reviewer and a `main` branch rule.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: orin-dx/callisto/.github/actions/setup-callisto@c5578e6a63754b54575b3ac7518cc1753e443393 # callisto@0.8.0
        with:
          version: callisto@0.8.0
          verification: require
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-candidate.outputs.release_source_sha }}
          path: release-source
          fetch-depth: 0
          # The release-source checkout alone needs Git credentials: tag
          # dispatch pushes from it.
          persist-credentials: true
      # Downloaded under $RUNNER_TEMP, never the workspace: `callisto release
      # execute` re-checks release trust before every dispatch and requires a
      # worktree with no tracked or untracked files.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-intent
          path: ${{ runner.temp }}/release-intent
      - name: Verify same-run handoff before credentials
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/release-intent"
          shasum -a 256 -c release-intent.json.sha256
      # Pattern A from callisto's docs/06-publishing.md: npm reads the
      # user-level .npmrc for every publish in this job. pnpm (this repo's
      # package manager, which callisto shells out to) honours the same file.
      - name: Authenticate with the npm registry
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
      - name: Execute verified release
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE_SHA_INPUT: ${{ inputs.release_source_sha }}
        run: |
          set -euo pipefail
          state_dir="${RUNNER_TEMP}/callisto-release-state/${GITHUB_RUN_ID}"
          mkdir -p "$state_dir"
          args=(
            --source-root "$GITHUB_WORKSPACE/release-source"
            --intent "${RUNNER_TEMP}/release-intent/release-intent.json"
            --state "$state_dir/execution-state.json"
            --receipt "$state_dir/release-receipt.json"
            --orchestration-revision "$GITHUB_SHA"
            --profile production
          )
          if [[ -n "$RELEASE_SOURCE_SHA_INPUT" ]]; then
            args+=(--recovery)
          fi
          callisto release execute "${args[@]}"
      - name: Summarize receipt
        if: always()
        run: |
          receipt="${RUNNER_TEMP}/callisto-release-state/${GITHUB_RUN_ID}/release-receipt.json"
          if [[ -f "$receipt" ]]; then
            {
              echo '### Release receipt'
              echo '```json'
              cat "$receipt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload receipt and execution state
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-receipt
          path: ${{ runner.temp }}/callisto-release-state/${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
