[workspace]
members = [
    "crates/core",
    "crates/binding",
    "crates/cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
authors = ["oxc-react-docgen contributors"]
license = "AGPL-3.0-or-later"

[workspace.dependencies]
# OXC — all main crates move in lockstep; module_lexer and resolver have separate versioning
oxc_allocator     = "0.135"
oxc_parser        = "0.135"
oxc_ast           = "0.135"
oxc_ast_visit     = "0.135"
oxc_span          = "0.135"
oxc_syntax        = "0.135"
oxc_module_lexer  = "0.38"
oxc_resolver      = "11"

# Core data
compact_str       = { version = "0.9", features = ["serde"] }
rustc-hash        = "2.1"
dashmap           = "6.1"
arc-swap          = "1.9"
camino            = { version = "1.2", features = ["serde1"] }
indexmap          = { version = "2.14", features = ["serde"] }
dirs              = "6.0"

# Serde
serde             = { version = "1.0", features = ["derive"] }
serde_json        = "1.0"
rmp-serde         = "1.3"

# Error handling
thiserror         = "2.0"
miette            = "7.6"
anyhow            = "1.0"

# Parallelism
rayon             = "1.12"
tokio             = { version = "1.52", features = ["rt-multi-thread", "process", "io-util", "sync", "macros"] }

# File system
ignore            = "0.4"

# LSP (Tier 4 scaffold — not implemented)
lsp-types         = "0.97"

# CLI
clap              = { version = "4.6", features = ["derive", "env", "wrap_help"] }
clap_complete     = "4.6"
clap_mangen       = "0.3"
indicatif         = "0.18"
tracing-indicatif = "0.3"
tracing           = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
owo-colors        = "4.3"
watchexec         = "8.2"

# NAPI (3.x series)
napi              = { version = "3", features = ["napi4"] }
napi-derive       = "3"

# Dev
divan             = "0.1"
insta             = { version = "1.48", features = ["json", "redactions"] }
pretty_assertions = "1.4"
tempfile          = "3.20"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
debug = true
